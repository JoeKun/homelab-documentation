# /usr/local/etc/smartd.conf: Configuration file for smartd.

# --- Spinning disks: 6x WD140EFGX (14 TB) behind mpr0 ---
#
# Monitor all attributes except normalized Temperature (194), but track
# Temperature changes >= 4 Celsius, report Temperatures >= 40 Celsius and
# changes in Raw value of Reallocated_Sector_Ct (5). Send mail on SMART
# failures or when Temperature is >= 45 Celsius. The extended self-test takes
# 26 hours on these drives, so they are staggered every other day of the month.
DEFAULT -a -I 194 -W 4,40,45 -R 5 -m root
/dev/da0 -s L/../01/./03
/dev/da1 -s L/../03/./03
/dev/da2 -s L/../05/./03
/dev/da3 -s L/../07/./03
/dev/da4 -s L/../09/./03
/dev/da5 -s L/../11/./03

# --- NVMe: monitored via the controller nodes, not the nda peripherals ---
#
# The ATA directives above do not apply, so the defaults are replaced here.
# Temperature thresholds sit below the lowest Warning Composite Temperature
# Threshold reported by any drive in this machine (80 Celsius).
DEFAULT -H -l error -l selftest -W 0,70,78 -m root

# Samsung 990 PRO: system pool, 3-way mirror.
/dev/nvme0 -d nvme -s L/../13/./03
/dev/nvme1 -d nvme -s L/../14/./03
/dev/nvme2 -d nvme -s L/../15/./03

# Intel Optane 905P Series 960 GB: no self-test support, and no
# temperature thresholds reported, so -W above is the only temperature
# coverage on these two.
/dev/nvme3 -d nvme
/dev/nvme7 -d nvme

# Samsung PM9A3 1.92 TB NVMe Enterprise SSD.
/dev/nvme4 -d nvme -s L/../16/./03
/dev/nvme5 -d nvme -s L/../17/./03
/dev/nvme6 -d nvme -s L/../18/./03
/dev/nvme8 -d nvme -s L/../19/./03

