# /usr/local/etc/periodic.conf.d/ldap-backup.conf

# Daily backup of the LDAP directory.
daily_ldap_backup_enable="YES"

# The directory where LDAP backups are stored.
daily_ldap_backup_directory="/var/backups/openldap"

# The number of distinct LDAP directory backups to keep.
# Since a new backup is only written on a day the LDAP directory actually
# changed, ten backups commonly reach back much further than ten days.
daily_ldap_backup_generations="10"
