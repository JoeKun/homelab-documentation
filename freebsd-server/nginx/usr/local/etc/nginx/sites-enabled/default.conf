# /usr/local/etc/nginx/sites-enabled/default.conf

# Catch-all virtual host, answering for any name no other virtual host claims.
# Without it, such a request would be served by whichever virtual host happens
# to be loaded first, which is not something you want to leave to chance.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root /usr/local/www/nginx;
    include error_pages;
}

server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    http2        on;
    server_name  _;

    include ssl_wildcard_certificate;

    root /usr/local/www/nginx;
    include error_pages;
}
