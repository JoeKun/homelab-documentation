# /usr/local/etc/nginx/nginx.conf: main configuration file for nginx

user www;

# One worker process per available CPU core.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    index index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log info;

    sendfile on;
    keepalive_timeout 65;

    # SSL parameters shared by every virtual host.
    include ssl_parameters;

    # FastCGI process manager for PHP.
    upstream php-handler {
        server unix:/var/run/php-fpm.sock;
    }

    # Each virtual host belongs in its own discrete file.
    include sites-enabled/*.conf;
}
